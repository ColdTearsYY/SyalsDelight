farmersdelight_recipes:
  syals_delight:potato_to_peeled_potato:
    station: cutting_board
    input:
      item: minecraft:potato
      tools:
        - syals_delight:peeler
    output:
      - item: syals_delight:peeled_potato
        count: 1
  syals_delight:peeled_potato_to_potato_slices:
    station: cutting_board
    input:
      item: syals_delight:peeled_potato
      tools:
        - '#farmersdelight:tools/knives'
    output:
      - item: syals_delight:potato_slice
        count: 3
